<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SafeSpace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--card:#151525;--accent:#8b5cf6;--accent2:#a78bfa;--text:#e2e8f0;--muted:#64748b;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--radius:14px}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:0;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#1a1040,#2d1b69);padding:20px 16px 16px;text-align:center}
.header h1{font-size:22px;color:#fff}
.header p{font-size:11px;color:var(--accent2);margin-top:4px}
.nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid #1e1e35;position:sticky;top:0;z-index:10}
.nav-btn{padding:7px 12px;border-radius:20px;background:transparent;border:1px solid #2a2a4a;color:var(--muted);font-size:11px;white-space:nowrap;cursor:pointer;transition:.15s}
.nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page{display:none;padding:16px;animation:fadeIn .2s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid #1e1e35;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{font-size:14px;color:var(--accent);margin-bottom:8px}
.card p{font-size:12px;line-height:1.7;color:var(--muted)}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:.15s;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-sos{background:var(--red);color:#fff;font-size:15px}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-green{background:var(--green);color:#000}
.btn:active{transform:scale(.97)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid-btn{padding:14px 8px;border-radius:12px;background:var(--card);border:1px solid #2a2a4a;text-align:center;cursor:pointer;transition:all .2s;font-size:11px;color:var(--text)}
.grid-btn:active{border-color:var(--accent);background:#8b5cf610;transform:scale(.93)}
.grid-btn .icon{font-size:22px;display:block;margin-bottom:4px;transition:transform .3s}
.grid-btn:active .icon{transform:scale(1.3) rotate(10deg)}
.breathe-box{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6366f1);margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600}
.breathe-box.active{animation:breatheAnim 19s infinite}
@keyframes breatheAnim{0%,100%{transform:scale(.7);opacity:.6}10.5%{transform:scale(1.2);opacity:1}47.4%{transform:scale(1.2);opacity:1}57.9%{transform:scale(.7);opacity:.6}}
.mood-row{display:flex;gap:8px;justify-content:center;margin:16px 0}
.mood-item{font-size:32px;padding:10px;border-radius:12px;cursor:pointer;transition:all .2s;border:2px solid transparent}
.mood-item:active,.mood-item.sel{border-color:var(--accent);transform:scale(1.3) rotate(10deg);background:#8b5cf620}
.check-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #1e1e35;font-size:12px;cursor:pointer}
.check-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex-shrink:0;transition:.15s;display:flex;align-items:center;justify-content:center}
.check-item.done .check-box{background:var(--green);border-color:var(--green)}
.check-item.done .check-box::after{content:'✓';color:#fff;font-size:11px}
.progress{height:6px;background:#1e1e35;border-radius:3px;margin:10px 0;overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .4s}
.quote-text{font-size:15px;line-height:1.7;text-align:center;padding:16px;font-style:italic}
.result{text-align:center;padding:20px;font-size:14px;line-height:1.8}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;background:#8b5cf620;color:var(--accent);margin:2px}
textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a4a;background:var(--bg);color:var(--text);font-size:13px;resize:none;height:80px;margin-bottom:8px}
.spin{animation:spin 1s ease-out}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}
.bounce{animation:bounce .6s ease}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.float{animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{animation:glow 1.5s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 5px var(--accent)}to{text-shadow:0 0 20px var(--accent),0 0 40px var(--accent)}}
.slot-spin{animation:slotSpin .8s cubic-bezier(.17,.67,.83,.67)}
@keyframes slotSpin{0%{transform:translateY(-200px);opacity:0}60%{transform:translateY(10px)}100%{transform:translateY(0);opacity:1}}
.game-result{text-align:center;padding:24px;font-size:48px;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.game-result .label{font-size:14px;margin-top:8px;color:var(--text)}
.game-result .sub{font-size:11px;color:var(--muted);margin-top:4px}
.coin{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto;box-shadow:0 4px 15px #fbbf2440}
.ball{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#1a1a2e,#000);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin:0 auto;box-shadow:0 4px 20px #00000080;border:3px solid #333}
.wheel{width:100px;height:100px;border-radius:50%;background:conic-gradient(var(--accent),var(--green),var(--yellow),var(--red),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 4px 20px #8b5cf640}
.wheel.spinning{animation:wheelSpin 2s cubic-bezier(.17,.67,.12,.99)}
@keyframes wheelSpin{0%{transform:rotate(0)}100%{transform:rotate(1440deg)}}
.num-box{width:80px;height:80px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:700;margin:0 auto;box-shadow:0 4px 20px #8b5cf640}
</style>
</head>
<body>

<div class="nav" id="nav"></div>

const facts=["🧠 Мозг подростка перестраивается до 25 лет","💙 87% получивших помощь говорят что стало легче","🎵 Музыка снижает кортизол на 25%","🌙 Подросткам нужно 8-10 часов сна","🤝 Один друг снижает риск депрессии на 40%","💪 30 мин активности = антидепрессант","🌈 Плакать полезно — выходят гормоны стресса","📱 Перерыв от соцсетей улучшает самооценку","🐾 Животные снижают тревогу","✨ 3 благодарности в день меняют мозг за 21 день","🌍 1 млрд людей с ментальными проблемами — не стыдно","🧘 5 мин дыхания активируют парасимпатику","🦋 Нейропластичность работает в любом возрасте","💗 Уязвимость — суперсила","🌱 Ты растёшь даже когда не замечаешь"];

const kindness=["💌 Напиши кому-то «Рад что ты есть»","🤗 Обними кого-то","📱 Напиши старому другу","😊 Улыбнись 3 незнакомцам","📝 Оставь добрую записку","🎵 Поделись песней","💬 Скажи «спасибо»","🌸 Подари цветок","📣 Похвали кого-то","🍪 Поделись едой","🗑️ Убери чужой мусор","🤝 Помоги кому-то"];
const copingTech=[
{e:'🧊',t:'Лёд в руках',d:'Сожми кубик льда. Холод переключает мозг с боли.'},
{e:'✏️',t:'Рисование',d:'Нарисуй эмоцию. Линии, цвета, формы.'},
{e:'🏃',t:'Движение',d:'20 прыжков, 10 приседаний, потряси руками.'},
{e:'🎵',t:'Музыка',d:'Громкое если злость, тихое если тревога.'},
{e:'📝',t:'Письмо себе',d:'Напиши письмо себе из будущего.'},
{e:'🌳',t:'Природа',d:'Выйди на 5 мин. Посмотри на небо.'},
{e:'🤗',t:'Обнять себя',d:'Скрести руки, ладони на плечи, дыши.'},
{e:'🧠',t:'Переключение',d:'Назови 5 красных предметов вокруг.'},
];
const storyList=["Мне было 14, я думал что никому не нужен. Написал сюда. Помощник просто выслушал. Стало легче.","Я боялась рассказать маме про буллинг. Здесь мне помогли найти слова. Теперь всё ок.","Панические атаки каждый день. Научили дышать 4-7-8. Реально работает.","Думал что я один такой. Оказалось — нет. И это уже помогло.","Не спала неделю от тревоги. Помощник посоветовал технику. Уснула в ту же ночь."];

function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

function go(id){
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',pages[i].id===id));
  render(id);
}

function render(id){
  const el=document.getElementById('pages');
  switch(id){


case 'home': el.innerHTML=`<div class="page active">
<div class="card"><h3>👋 Привет!</h3><p>Здесь безопасно. Выбери что нужно — всё через кнопки.</p></div>
<div class="grid-2">
<div class="grid-btn" onclick="go('chat')"><span class="icon">💬</span>Написать</div>
<div class="grid-btn" onclick="go('breathe')"><span class="icon">🫁</span>Подышать</div>
<div class="grid-btn" onclick="go('mood')"><span class="icon">😊</span>Настроение</div>
<div class="grid-btn" onclick="go('care')"><span class="icon">🧴</span>Забота</div>
<div class="grid-btn" onclick="go('games')"><span class="icon">🎮</span>Игры</div>
<div class="grid-btn" onclick="go('coping')"><span class="icon">🧰</span>Копинг</div>
<div class="grid-btn" onclick="go('diary')"><span class="icon">📔</span>Дневник</div>
<div class="grid-btn" onclick="go('facts')"><span class="icon">💡</span>Факты</div>
<div class="grid-btn" onclick="go('affirm')"><span class="icon">✨</span>Аффирмации</div>
<div class="grid-btn" onclick="go('sleep')"><span class="icon">😴</span>Сон</div>
<div class="grid-btn" onclick="go('kind')"><span class="icon">💛</span>Доброта</div>
<div class="grid-btn" onclick="go('stories')"><span class="icon">📖</span>Истории</div>
<div class="grid-btn" onclick="go('achieve')"><span class="icon">🏆</span>Бейджи</div>
<div class="grid-btn" onclick="go('sos')"><span class="icon">🆘</span>SOS</div>
</div></div>`;break;

case 'chat': el.innerHTML=`<div class="page active">
<div class="card"><h3>💬 Написать помощнику</h3><p>Выбери тему, напиши сообщение — помощник ответит в боте.</p></div>
<div class="grid-2">
${['😰 Тревога','😔 Одиночество','👊 Буллинг','🏠 Семья','💔 Отношения','🌑 Депрессия','🩸 Самоповреждение','📚 Школа','🍽️ РПП','🌈 Идентичность','😴 Сон','🎮 Зависимость','🕊️ Горе','👨‍👩‍👧 Родители','❓ Другое','🆘 Кризис'].map(c=>`<div class="grid-btn" onclick="pickTopic('${c}')">${c}</div>`).join('')}
</div>
<div id="chatForm" style="display:none">
<textarea id="chatMsg" placeholder="Напиши что беспокоит..."></textarea>
<button class="btn btn-primary" onclick="sendMsg()">📨 Отправить помощнику</button>
<p style="font-size:10px;color:var(--muted);text-align:center;margin-top:6px">Откроется бот — вставь сообщение туда</p>
</div>
</div>`;break;

case 'breathe': el.innerHTML=`<div class="page active">
<div class="card"><h3>🫁 Дыхательные техники</h3><p>Выбери технику и следи за кругом.</p></div>
<div class="grid-2">
<div class="grid-btn" onclick="startBreath('478')"><span class="icon">🌙</span>4-7-8 Сон</div>
<div class="grid-btn" onclick="startBreath('box')"><span class="icon">⬜</span>Бокс</div>
<div class="grid-btn" onclick="startBreath('calm')"><span class="icon">🌊</span>Спокойствие</div>
<div class="grid-btn" onclick="startBreath('energy')"><span class="icon">⚡</span>Энергия</div>

</div>`;break;

case 'mood': el.innerHTML=`<div class="page active">

<div class="mood-item" onclick="saveMood('😊','Отлично')">😊</div>

<div class="mood-item" onclick="saveMood('😐','Нормально')">😐</div>
<div class="mood-item" onclick="saveMood('😔','Плохо')">😔</div>
<div class="mood-item" onclick="saveMood('😢','Ужасно')">😢</div>
</div>
<div id="moodResult"></div>
<div class="card"><h3>📊 Неделя</h3><div id="moodWeek" style="font-size:20px;text-align:center;letter-spacing:4px"></div></div>

case 'care':renderCare(el);break;
case 'games':renderGames(el);break;
case 'coping': el.innerHTML=`<div class="page active">
<div class="card"><h3>🧰 Копинг-техники</h3><p>Когда плохо — попробуй одну.</p></div>
<div class="grid-2">${copingTech.map((c,i)=>`<div class="grid-btn" onclick="showCope(${i})"><span class="icon">${c.e}</span>${c.t}</div>`).join('')}</div>
<div id="copeDetail"></div></div>`;break;

case 'diary':renderDiary(el);break;
case 'facts': el.innerHTML=`<div class="page active"><div class="card"><h3>💡 Факт</h3><p class="quote-text">${rand(facts)}</p></div><button class="btn btn-outline" onclick="go('facts')">🔄 Другой</button></div>`;break;
case 'affirm': el.innerHTML=`<div class="page active"><div class="card"><h3>✨ Аффирмация</h3><p class="quote-text">${rand(affirmations)}</p><p style="text-align:center;font-size:11px;color:var(--muted)">Повтори 3 раза 💜</p></div><button class="btn btn-outline" onclick="go('affirm')">🔄 Другая</button></div>`;break;
case 'sleep': el.innerHTML=`<div class="page active"><div class="card"><h3>😴 Совет для сна</h3><p class="quote-text">${rand(sleepTips)}</p></div><button class="btn btn-outline" onclick="go('sleep')">🔄 Ещё</button></div>`;break;
case 'kind': el.innerHTML=`<div class="page active"><div class="card"><h3>💛 Акт доброты</h3><p class="quote-text">${rand(kindness)}</p><p style="text-align:center;font-size:11px;color:var(--muted)">Доброта к другим лечит и тебя 💙</p></div><button class="btn btn-outline" onclick="go('kind')">🔄 Другая идея</button></div>`;break;
case 'stories': el.innerHTML=`<div class="page active"><div class="card"><h3>📖 Анонимная история</h3><p class="quote-text">«${rand(storyList)}»</p><p style="text-align:center;font-size:11px;color:var(--muted)">— Аноним</p></div><button class="btn btn-outline" onclick="go('stories')">📖 Другая</button></div>`;break;

<button class="btn btn-outline" onclick="go('breathe')" style="margin-top:8px">🫁 Подышать</button>
<button class="btn btn-outline" onclick="go('coping')">🧰 Копинг-техника</button>

  }
}

let selectedTopic='';
function pickTopic(topic){
  selectedTopic=topic;
  document.getElementById('chatForm').style.display='block';
  document.getElementById('chatMsg').placeholder=`Тема: ${topic}\nНапиши что беспокоит...`;
  document.getElementById('chatMsg').focus();
}
function sendMsg(){
  const text=document.getElementById('chatMsg').value.trim();
  if(!text){alert('Напиши сообщение');return}
  // Copy to clipboard and open bot
  navigator.clipboard.writeText(text).catch(()=>{});
  tg.openTelegramLink('https://t.me/teens_help_ru_bot?start=chat');
  tg.close();
}
function sendSOS(){tg.openTelegramLink('https://t.me/teens_help_ru_bot?start=sos');tg.close()}

// Breathing
function startBreath(type){
  const c=document.getElementById('bCircle');
  const ins=document.getElementById('bInstr');
  c.classList.add('active');
  const info={478:'Вдох 4с → Держи 7с → Выдох 8с',box:'Вдох 4с → Держи 4с → Выдох 4с → Держи 4с',calm:'Вдох 4с → Выдох 6с',energy:'Быстрый вдох-выдох 30 раз'};
  ins.textContent=info[type]||'';
  let step=0;const labels=['Вдох...','Держи...','Выдох...'];
  clearInterval(window._bInt);
  window._bInt=setInterval(()=>{c.textContent=labels[step%3];step++},4000);
}

// Mood
function saveMood(emoji,label){
  const week=LS('moodWeek')||[];
  week.push({emoji,date:new Date().toLocaleDateString()});
  if(week.length>7)week.shift();
  SS('moodWeek',week);
  document.getElementById('moodResult').innerHTML=`<div class="result">${emoji}<br>${label}<br><span style="color:var(--muted);font-size:11px">Сохранено! 💙</span></div>`;
  renderMoodWeek();
}
function renderMoodWeek(){
  const el=document.getElementById('moodWeek');if(!el)return;
  const week=LS('moodWeek')||[];
  el.textContent=week.map(m=>m.emoji).join(' ')||'Нет данных';
}

// Self-care
function renderCare(el){
  const items=['💧 Вода','🍎 Еда','😴 Сон 7+','🚿 Душ','🌳 Улица','📵 Перерыв','🎵 Музыка','💬 Общение','📝 Записал','🤗 Приятное'];
  let done=LS('careDone')||[];
  const today=new Date().toDateString();
  if(LS('careDate')!==today){done=[];SS('careDone',[]);SS('careDate',today)}
  const pct=Math.round(done.length/items.length*100);
  el.innerHTML=`<div class="page active"><div class="card"><h3>🧴 Забота о себе</h3>
  <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
  <p style="font-size:11px;color:var(--muted)">${done.length}/10 выполнено${done.length===10?' 🎉 Супер!':''}</p>
  ${items.map((item,i)=>`<div class="check-item${done.includes(i)?' done':''}" onclick="toggleCare(${i})"><div class="check-box"></div><span>${item}</span></div>`).join('')}
  </div></div>`;
}
function toggleCare(i){
  let done=LS('careDone')||[];
  if(done.includes(i))done=done.filter(x=>x!==i);else done.push(i);
  SS('careDone',done);SS('careDate',new Date().toDateString());
  renderCare(document.getElementById('pages'));
}

// Games
function renderGames(el){
  el.innerHTML=`<div class="page active"><div class="card"><h3>🎮 Мини-игры</h3><p>Нажми и смотри анимацию!</p></div>
  <div class="grid-2">
  <div class="grid-btn" onclick="gameCoin()"><span class="icon">🪙</span>Монетка</div>
  <div class="grid-btn" onclick="game8ball()"><span class="icon">🎱</span>Шар судьбы</div>
  <div class="grid-btn" onclick="gameMood()"><span class="icon">🎰</span>Колесо</div>
  <div class="grid-btn" onclick="gameNum()"><span class="icon">🔢</span>Число дня</div>
  </div><div id="gameResult"></div></div>`;
}
function gameCoin(){
  const r=document.getElementById('gameResult');
  const side=Math.random()>.5?'Орёл':'Решка';
  r.innerHTML=`<div class="game-result"><div class="coin spin">🪙</div><div class="label">Крутится...</div></div>`;
  setTimeout(()=>{r.innerHTML=`<div class="game-result"><div class="coin bounce">${side==='Орёл'?'👑':'🌿'}</div><div class="label">${side}!</div></div>`;},1000);
}
function game8ball(){
  const a=["✅ Определённо да!","❌ Точно нет","🤔 Возможно...","✨ Однозначно!","🌙 Не сейчас","💫 В твоих руках","🎯 Да!","🔮 Туманно...","💜 Спроси позже","⭐ Звёзды говорят да"];
  const r=document.getElementById('gameResult');
  r.innerHTML=`<div class="game-result"><div class="ball shake">🎱</div><div class="label">Думаю...</div></div>`;
  setTimeout(()=>{r.innerHTML=`<div class="game-result"><div class="ball bounce"><span style="font-size:10px">${rand(a)}</span></div><div class="label">Шар говорит:</div><div class="sub glow">${rand(a)}</div></div>`;},1200);
}
function gameMood(){
  const m=["😊 Радость","💪 Сила","🦋 Лёгкость","🌟 Вдохновение","🤗 Тепло","🌊 Спокойствие","🎨 Творчество","🌈 Надежда","🔥 Энергия","💎 Уверенность"];
  const r=document.getElementById('gameResult');
  r.innerHTML=`<div class="game-result"><div class="wheel spinning"></div><div class="label">Крутится...</div></div>`;
  setTimeout(()=>{const res=rand(m);r.innerHTML=`<div class="game-result"><div class="wheel bounce" style="font-size:28px">${res.split(' ')[0]}</div><div class="label slot-spin">${res}</div><div class="sub">Твоё настроение на сегодня!</div></div>`;},2000);
}
function gameNum(){
  const n=Math.floor(Math.random()*100)+1;
  const r=document.getElementById('gameResult');
  r.innerHTML=`<div class="game-result"><div class="num-box shake">?</div><div class="label">Генерирую...</div></div>`;
  setTimeout(()=>{
    const msg=n>80?'🚀 Великие дела впереди!':n>60?'🌟 Удача на твоей стороне':n>40?'⚖️ Баланс и гармония':n>20?'💪 Время действовать':'🌱 Новое начало';
    r.innerHTML=`<div class="game-result"><div class="num-box bounce">${n}</div><div class="label glow">${msg}</div></div>`;
  },800);
}

// Coping
function showCope(i){const c=copingTech[i];document.getElementById('copeDetail').innerHTML=`<div class="card"><h3>${c.e} ${c.t}</h3><p>${c.d}</p></div>`}

// Diary
function renderDiary(el){
  const entries=LS('diary')||[];
  el.innerHTML=`<div class="page active"><div class="card"><h3>📔 Дневник</h3><p>Запиши как ты себя чувствуешь.</p></div>
  <textarea id="diaryInput" placeholder="Что на душе..."></textarea>
  <button class="btn btn-primary" onclick="saveDiary()">📝 Сохранить</button>
  <div class="card"><h3>Записи</h3>${entries.length?entries.slice(-5).reverse().map(e=>`<p style="border-bottom:1px solid #1e1e35;padding:8px 0;font-size:12px">📅 ${e.date}<br>${e.text}</p>`).join(''):'<p>Пока пусто.</p>'}</div></div>`;
}
function saveDiary(){
  const text=document.getElementById('diaryInput').value.trim();if(!text)return;
  const entries=LS('diary')||[];
  entries.push({date:new Date().toLocaleDateString(),text});
  SS('diary',entries.slice(-30));
  renderDiary(document.getElementById('pages'));
}

// Achievements
function renderAchieve(el){
  const all=[{id:'mood',l:'😊 Отметил настроение'},{id:'care3',l:'🧴 3 пункта заботы'},{id:'breath',l:'🫁 Подышал'},{id:'diary',l:'📔 Запись в дневнике'},{id:'game',l:'🎮 Сыграл в игру'},{id:'fact',l:'💡 Прочитал факт'},{id:'kind',l:'💛 Акт доброты'},{id:'story',l:'📖 Прочитал историю'},{id:'affirm',l:'✨ Аффирмация'},{id:'week',l:'🔥 7 дней подряд'}];
  const got=LS('badges')||[];
  const pct=Math.round(got.length/all.length*100);
  el.innerHTML=`<div class="page active"><div class="card"><h3>🏆 Достижения</h3>
  <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
  <p style="font-size:11px;color:var(--muted)">${got.length}/${all.length}</p>
  ${all.map(a=>`<div style="padding:6px 0;font-size:12px">${got.includes(a.id)?'✅':'⬜'} ${a.l}</div>`).join('')}
  </div></div>`;
}

// Init
go('home');
</script>
